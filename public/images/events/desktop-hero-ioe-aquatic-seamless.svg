<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" fill="none">
<title>IOE 2027 Hero Aquatic — Seamless Transition</title>
<defs>
<linearGradient id="upper" x1="-70" y1="-18" x2="1480" y2="365" gradientUnits="userSpaceOnUse"><stop stop-color="#C4F8F0"/><stop offset=".33" stop-color="#8DD8E0"/><stop offset=".64" stop-color="#62ADD0"/><stop offset="1" stop-color="#7DDEE9"/></linearGradient>
<linearGradient id="glow" x1="760" y1="90" x2="760" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#D9F7F6" stop-opacity=".3"/><stop offset="1" stop-color="#D9F7F6" stop-opacity="0"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#D2FFFF" stop-opacity=".62"/><stop offset=".55" stop-color="#89E1E7" stop-opacity=".22"/><stop offset="1" stop-color="#89E1E7" stop-opacity="0"/></radialGradient>
<linearGradient id="edgefade" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="white"/><stop offset=".49" stop-color="white"/><stop offset=".72" stop-color="white" stop-opacity=".75"/><stop offset=".94" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="fade"><rect width="1440" height="540" fill="url(#edgefade)"/></mask>
</defs>
<g mask="url(#fade)">
<!-- One continuous ocean ribbon; stays visually clear of the content and retreats above hero middle -->
<path d="M-90 99 C190 -73 357 -55 575 12 C807 84 953 142 1111 96 C1244 57 1321 -6 1536 -98 L1538 20 C1373 118 1297 176 1156 200 C986 228 793 159 563 88 C333 16 170 59 -90 226 Z" fill="url(#upper)" opacity=".92"/>
<path d="M-90 99 C190 -73 357 -55 575 12 C807 84 953 142 1111 96 C1244 57 1321 -6 1536 -98" stroke="#E0FFFA" stroke-width="5" opacity=".9"/>
<path d="M-95 150 C174 -15 355 4 569 66 C805 135 957 194 1122 149 C1263 111 1380 35 1540 -48" stroke="#E5FFFF" stroke-width="2" opacity=".65"/>
<path d="M-95 173 C174 8 355 27 569 89 C805 158 957 217 1122 172 C1263 134 1380 58 1540 -25" stroke="#F0FFFD" stroke-width="1.8" opacity=".44"/>
<!-- Diffuse atmosphere fades to transparency far before next section boundary -->
<ellipse cx="140" cy="290" rx="235" ry="145" fill="url(#glow)"/>
<circle cx="237" cy="316" r="23" fill="url(#orb)"/>
<circle cx="285" cy="347" r="5" fill="#9CEDE8" opacity=".5"/>
<circle cx="1125" cy="332" r="4" fill="#75C5D5" opacity=".52"/>
<circle cx="1190" cy="272" r="17" stroke="#9BE7E9" stroke-width="1.6" opacity=".46"/>
<circle cx="1290" cy="364" r="8" fill="url(#orb)"/>
</g>
