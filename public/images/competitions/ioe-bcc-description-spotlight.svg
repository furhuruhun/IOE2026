<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="780" viewBox="0 0 1200 780" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">IOE Business Case Competition — Soft Ocean Current Spotlight</title>
  <desc id="desc">Transparent decorative aquatic glow for a description section. A near-white center, soft cyan and seafoam edges, and faint organic current lines, without a funnel shape.</desc>
  <defs>
    <radialGradient id="mist" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(635 385) rotate(2) scale(550 334)">
      <stop stop-color="#F8FEFF" stop-opacity=".96"/>
      <stop offset=".24" stop-color="#F2FCFD" stop-opacity=".91"/>
      <stop offset=".49" stop-color="#DFF8F8" stop-opacity=".72"/>
      <stop offset=".69" stop-color="#B3F6E9" stop-opacity=".42"/>
      <stop offset=".86" stop-color="#6EDDE0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6EDDE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(899 355) rotate(90) scale(285 355)">
      <stop stop-color="#6EDDE0" stop-opacity=".27"/>
      <stop offset=".51" stop-color="#91E8EC" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6EDDE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(330 496) rotate(-18) scale(343 243)">
      <stop stop-color="#B3F6E9" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#C5F8ED" stop-opacity=".23"/>
      <stop offset="1" stop-color="#B3F6E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperCurrent" x1="100" y1="116" x2="1070" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B3F6E9" stop-opacity="0"/>
      <stop offset=".23" stop-color="#6EDDE0" stop-opacity=".06"/>
      <stop offset=".64" stop-color="#23A7C1" stop-opacity=".095"/>
      <stop offset="1" stop-color="#B3F6E9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lowerCurrent" x1="0" y1="485" x2="1200" y2="685" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23A7C1" stop-opacity="0"/>
      <stop offset=".25" stop-color="#6EDDE0" stop-opacity=".12"/>
      <stop offset=".62" stop-color="#B3F6E9" stop-opacity=".19"/>
      <stop offset="1" stop-color="#6DABD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="currentLine" x1="70" y1="610" x2="1110" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23A7C1" stop-opacity="0"/>
      <stop offset=".22" stop-color="#23A7C1" stop-opacity=".14"/>
      <stop offset=".64" stop-color="#6DABD6" stop-opacity=".13"/>
      <stop offset="1" stop-color="#6EDDE0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topLine" x1="150" y1="180" x2="1100" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EDDE0" stop-opacity="0"/>
      <stop offset=".36" stop-color="#23A7C1" stop-opacity=".11"/>
      <stop offset=".72" stop-color="#23A7C1" stop-opacity=".07"/>
      <stop offset="1" stop-color="#23A7C1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- All fills fade to transparent; no opaque rectangle behind page content. -->
  <ellipse cx="635" cy="385" rx="550" ry="334" fill="url(#mist)"/>
  <ellipse cx="899" cy="355" rx="355" ry="285" fill="url(#blueHalo)"/>
  <ellipse cx="330" cy="496" rx="343" ry="243" fill="url(#mintHalo)"/>

  <!-- Soft currents frame the description area, not a geometric funnel. -->
  <path d="M-25 235C182 125 308 116 471 164C677 227 825 77 1036 136C1133 163 1199 199 1230 247L1230 328C1063 239 896 222 721 246C530 273 377 191 222 248C102 292 40 303-25 288Z" fill="url(#upperCurrent)"/>
  <path d="M-20 543C173 480 276 508 437 572C620 643 793 630 953 553C1053 506 1134 488 1225 510L1225 631C1138 601 1039 609 945 654C779 736 605 727 411 645C239 573 124 567-20 620Z" fill="url(#lowerCurrent)"/>
  <path d="M100 583C267 528 391 577 532 625C706 685 834 624 952 575C1044 536 1101 538 1160 555" stroke="url(#currentLine)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M128 611C313 568 401 630 562 654C751 682 866 607 1017 565" stroke="url(#currentLine)" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M141 208C337 139 444 203 567 220C766 247 883 126 1100 186" stroke="url(#topLine)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
